<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - New Armada</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts: Inter -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        navy: {
                            800: '#0B3B60',
                            900: '#0B2B4C',
                            footer: '#082545',
                        },
                        brand: {
                            blue: '#00588A',
                            red: '#E31B23',
                            lightBlue: '#EAF3FA',
                            textMuted: '#6B7280',
                            border: '#E5E7EB'
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Memastikan tidak ada scrollbar pada layar desktop */
        html, body {
            height: 100vh;
            max-height: 100vh;
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
            background-color: #F4F6F9;
        }
    </style>
</head>
<body class="flex flex-col justify-between min-h-screen select-none">

    <!-- Main Content Container (Centered Vertically and Horizontally) -->
    <main class="flex-1 flex flex-col items-center justify-center px-4 py-6">

        <!-- Logo Section -->
        <div class="flex flex-col items-center mb-6">
            <!-- Shield Anchor Logo Emblem -->
            <div class="relative w-16 h-16 mb-2">
                <svg viewBox="0 0 100 110" class="w-full h-full drop-shadow-sm" fill="none" xmlns="http://www.w3.org/2000/svg">
                    <!-- Shield Border Outer -->
                    <path d="M50 5 L90 20 V60 C90 82 70 100 50 105 C30 100 10 82 10 60 V20 Z" stroke="#0B2B4C" stroke-width="4" fill="#FFFFFF" />
                    <!-- Anchor Graphic -->
                    <path d="M50 25 V75 M35 75 C35 83 65 83 65 75 M30 55 H70 M50 25 L45 35 H55 Z" stroke="#0B2B4C" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
                    <circle cx="50" cy="22" r="4" stroke="#0B2B4C" stroke-width="3" fill="none" />
                    <!-- Anchor Flukes -->
                    <path d="M28 70 L35 75 L32 80" stroke="#0B2B4C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <path d="M72 70 L65 75 L68 80" stroke="#0B2B4C" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
                    <!-- Red 'new' text ribbon in emblem -->
                    <path d="M22 45 Q50 40 78 45" stroke="#E31B23" stroke-width="12" stroke-linecap="round"/>
                    <text x="50" y="48" font-family="'Inter', sans-serif" font-weight="800" font-style="italic" font-size="13" fill="#FFFFFF" text-anchor="middle">new</text>
                </svg>
            </div>

            <!-- Brand Text Logo -->
            <div class="flex items-center space-x-1.5">
                <span class="text-red-600 font-extrabold text-2xl tracking-tight leading-none italic">new</span>
                <span class="text-navy-900 font-black text-2xl tracking-tight leading-none">armada</span>
            </div>
        </div>

        <!-- Login Card -->
        <div class="w-full max-w-[430px] bg-white rounded-2xl shadow-xl shadow-slate-200/60 p-8 border border-gray-100/80 transition-all">
            <!-- Card Header -->
            <div class="mb-6">
                <h1 class="text-2xl font-bold text-gray-900 tracking-tight">Masuk</h1>
                <p class="text-xs text-gray-500 mt-1.5 font-normal">Masukkan NIK dan password untuk melanjutkan.</p>
            </div>

            <!-- Login Form -->
            <form onsubmit="event.preventDefault(); handleLogin();" class="space-y-4" autocomplete="off">

                <!-- Pesan Error -->
                <div id="loginError" role="alert" class="hidden p-3 bg-red-50 border border-red-100 rounded-lg text-xs text-red-600 font-medium"></div>

                <!-- NIK Field -->
                <div>
                    <label for="nik" class="block text-xs font-semibold text-gray-700 mb-1.5">NIK</label>
                    <div class="relative flex items-center">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-400">
                            <!-- ID Card Icon -->
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V8a2 2 0 00-2-2h-5m-4 0V5a2 2 0 114 0v1m-4 0a2 2 0 104 0m-5 8a2 2 0 100-4 2 2 0 000 4zm0 0c1.306 0 2.417.835 2.83 2M9 14a3.001 3.001 0 00-2.83 2M15 11h3m-3 4h2"></path>
                            </svg>
                        </div>
                        <input
                            type="text"
                            id="nik"
                            name="nik"
                            placeholder="Masukkan NIK"
                            required
                            autocapitalize="off"
                            autocomplete="username"
                            spellcheck="false"
                            class="w-full pl-10 pr-3.5 py-2.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-600/30 focus:border-brand-blue transition-all"
                        >
                    </div>
                </div>

                <!-- Password Field -->
                <div>
                    <label for="password" class="block text-xs font-semibold text-gray-700 mb-1.5">Password</label>
                    <div class="relative flex items-center">
                        <div class="absolute inset-y-0 left-0 pl-3.5 flex items-center pointer-events-none text-gray-700">
                            <!-- Bullet Circle Icon -->
                            <svg class="w-3.5 h-3.5 fill-current" viewBox="0 0 24 24">
                                <circle cx="12" cy="12" r="8"/>
                            </svg>
                        </div>
                        <input
                            type="password"
                            id="password"
                            name="password"
                            placeholder="Masukkan password"
                            required
                            autocomplete="current-password"
                            class="w-full pl-10 pr-24 py-2.5 bg-white border border-gray-200 rounded-lg text-sm text-gray-900 placeholder-gray-400 focus:outline-none focus:ring-2 focus:ring-blue-600/30 focus:border-brand-blue transition-all"
                        >
                        <!-- Show/Hide Toggle Button -->
                        <button
                            type="button"
                            id="togglePassword"
                            onclick="togglePasswordVisibility()"
                            class="absolute right-3.5 text-xs font-medium text-gray-400 hover:text-gray-700 focus:outline-none transition-colors"
                        >
                            Lihat
                        </button>
                    </div>
                </div>

                <!-- Submit Button -->
                <div class="pt-2">
                    <button
                        type="submit"
                        id="submitBtn"
                        class="w-full bg-[#00588A] hover:bg-[#004872] active:bg-[#003B5C] text-white font-medium py-2.5 px-4 rounded-lg text-sm transition-colors shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-[#00588A] disabled:opacity-70 disabled:cursor-not-allowed"
                    >
                        Masuk
                    </button>
                </div>
            </form>

            <!-- Info Box -->
            <div class="mt-5 p-3.5 bg-[#EBF3FA] rounded-xl border border-blue-100/60 flex items-center justify-center">
                <p class="text-[11px] text-[#004369] font-normal leading-relaxed text-center">
                    Gunakan NIK yang sudah terdaftar untuk mengakses sistem.
                </p>
            </div>
        </div>
    </main>

    <!-- Footer Bar -->
    <footer class="w-full bg-[#082545] text-white px-8 py-3.5 flex flex-col sm:flex-row items-center justify-between text-xs font-normal border-t border-navy-900/50">
        <!-- Left Side Info -->
        <div class="flex items-center space-x-3 mb-2 sm:mb-0">
            <span class="font-bold text-red-500 italic">new <span class="text-white font-normal not-italic">armada group</span></span>
            <span class="text-gray-500">|</span>
            <span class="text-gray-300 text-[11px]">Portal Internal Section Viber</span>
        </div>

        <!-- Right Side Copyright -->
        <div class="text-gray-400 text-[11px]">
            &copy; 2026 PT Mekar Armada Jaya. All Rights Reserved.
        </div>
    </footer>

    <!-- JavaScript Logic -->
    <script>
        /* =========================================================
           PENGATURAN AKUN
           Tambah akun baru di sini. "redirect" adalah halaman tujuan
           setelah login berhasil. NIK tidak membedakan huruf besar/kecil,
           password membedakan huruf besar/kecil.

           CATATAN: ini hanya untuk simulasi frontend. Password di script
           bisa dilihat siapa pun lewat View Source, jadi ganti dengan
           verifikasi di server (backend) sebelum dipakai sungguhan.
           ========================================================= */
        const ACCOUNTS = [
            {
                nik: 'LT0003',
                password: 'LT123',
                role: 'leader',
                redirect: 'dashboard_leader.html'
            },
            {
                nik: 'publicdash',
                password: 'public123',
                role: 'public',
                redirect: 'dashboard_public.html'
            }
        ];

        const errorBox = document.getElementById('loginError');

        function showError(message) {
            errorBox.textContent = message;
            errorBox.classList.remove('hidden');
        }

        function hideError() {
            errorBox.classList.add('hidden');
        }

        document.getElementById('nik').addEventListener('input', hideError);
        document.getElementById('password').addEventListener('input', hideError);

        // Toggle Show/Hide Password
        function togglePasswordVisibility() {
            const passwordInput = document.getElementById('password');
            const toggleBtn = document.getElementById('togglePassword');

            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                toggleBtn.textContent = 'Sembunyikan';
            } else {
                passwordInput.type = 'password';
                toggleBtn.textContent = 'Lihat';
            }
        }

        // Login Handler
        function handleLogin() {
            const nik = document.getElementById('nik').value.trim();
            const password = document.getElementById('password').value;

            const account = ACCOUNTS.find(item =>
                item.nik.toLowerCase() === nik.toLowerCase() &&
                item.password === password
            );

            if (!account) {
                showError('NIK atau password salah. Silakan coba lagi.');
                return;
            }

            hideError();

            const submitBtn = document.getElementById('submitBtn');
            submitBtn.textContent = 'Memproses...';
            submitBtn.disabled = true;

            // Simpan sesi sederhana untuk dibaca halaman tujuan
            try {
                sessionStorage.setItem('sectionViberSession', JSON.stringify({
                    nik: account.nik,
                    role: account.role
                }));
            } catch (e) {}

            setTimeout(() => {
                window.location.href = account.redirect;
            }, 400);
        }
    </script>
</body>
</html>
